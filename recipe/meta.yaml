{% set name = "mcp-types" %}
{% set version = "2.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace("-", "_") }}-{{ version }}.tar.gz
  sha256: d7d939b9285c9961ae8866ba75ef85da34d12bafe276efbf4eb6a131786d8379

build:
  skip: true  # [py<310]
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - hatchling
    - uv-dynamic-versioning
  run:
    - python
    - pydantic >=2.12.0
    - typing_extensions >=4.13.0

test:
    imports:
      - mcp_types
    commands:
      - pip check
    requires:
      - pip
    

about:
  home: https://modelcontextprotocol.io
  summary: Model Context Protocol wire types
  description: |
    This package holds the protocol message models, JSON-RPC envelope types,
    per-version surface validators, and the protocol-version registry.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://py.sdk.modelcontextprotocol.io/
  dev_url: https://github.com/modelcontextprotocol/python-sdk

extra:
  recipe-maintainers:
    - jan-janssen
